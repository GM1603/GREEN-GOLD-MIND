<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Gold Mind | Premium Green Tea from Kerala</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="5.png">

    <!-- Primary Meta Tags -->
    <meta name="description" content="Premium artisanal whole leaf green tea from the Peermade region, 3500 ft above sea level. Pure, aromatic, and crafted for wellness. Direct from Kuttikkanam, Idukki.">
    <meta name="keywords" content="green tea, premium green tea, whole leaf green tea, orthodox green tea, Kerala green tea, Peermade tea, Kuttikkanam tea, artisanal tea, wellness tea, Green Gold Mind">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Green Gold Mind | Premium Green Tea">
    <meta property="og:description" content="Premium artisanal whole leaf green tea from the Peermade region, Kerala. Pure | Aromatic | Wellness.">
    <meta property="og:image" content="1.jpeg">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Philosopher:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <style>
        :root {
            --dark-green: #112d1b;
            --mid-green: #1a3d26;
            --light-green: #2a5235;
            --accent-green: #3a7d4a;
            --cream: #f5f3eb;
            --cream-light: #faf9f5;
            --gold: #c5a059;
            --gold-light: #d4b572;
            --gold-dark: #a8863e;
            --text-dark: #1a1a1a;
            --text-medium: #555555;
            --text-light: #888888;
            --white: #ffffff;
            --error-red: #c0392b;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 8px 30px rgba(0,0,0,0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--cream);
            color: var(--text-dark);
            line-height: 1.7;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 24px;
        }

        .enquiry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .enquiry-grid {
                grid-template-columns: 1fr;
                gap: 32px;
            }
        }

        .enquiry-info h2 {
            font-family: 'Philosopher', Georgia, serif;
            font-size: 2.2rem;
            color: var(--dark-green);
            margin-bottom: 16px;
        }

        .enquiry-info p {
            color: var(--text-medium);
            margin-bottom: 24px;
        }

        .enquiry-card {
            background: var(--white);
            padding: 32px;
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            border: 1px solid rgba(197, 160, 89, 0.2);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 16px;
        }

        .form-group label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--dark-green);
            margin-bottom: 6px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.95rem;
            background-color: var(--cream-light);
            transition: border-color var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
            background-color: var(--white);
        }

        .phone-row {
            display: flex;
            gap: 12px;
        }

        .phone-row .country-select {
            flex: 0 0 42%;
        }

        .phone-row .phone-input {
            flex: 1;
        }

        .error {
            color: var(--error-red);
            font-size: 0.78rem;
            margin-top: 4px;
            min-height: 18px;
        }

        .btn-gold {
            background: var(--gold);
            color: var(--dark-green);
            border: none;
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: background var(--transition), transform var(--transition);
        }

        .btn-gold:hover {
            background: var(--gold-light);
            transform: translateY(-1px);
        }

        .form-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-top: 8px;
        }

        #form-success {
            color: var(--accent-green);
            font-weight: 500;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>

<main class="container">
    <div class="enquiry-grid">
        <!-- Left Column: Context -->
        <div class="enquiry-info">
            <h2>Experience Pure Peermade Harvest</h2>
            <p>Connect with us for retail, sample collections, or wholesale distribution inquiries. Handcrafted tea delivered direct from the misty estates of Kuttikkanam.</p>
        </div>

        <!-- Right Column: Validated Form -->
        <div class="enquiry-card">
            <form id="enquiryForm" novalidate>
                <div class="form-group">
                    <label for="fullName">Full Name *</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Your full name" required>
                    <small class="error" id="err-name"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address (optional)</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com">
                    <small class="error" id="err-email"></small>
                </div>

                <div class="phone-row">
                    <div class="form-group country-select">
                        <label for="countryCode">Country *</label>
                        <select id="countryCode" name="countryCode" required>
                            <option value="+91">India (+91)</option>
                            <option value="+1">USA / Canada (+1)</option>
                            <option value="+44">UK (+44)</option>
                            <option value="+971">UAE (+971)</option>
                            <option value="+966">Saudi Arabia (+966)</option>
                            <option value="+65">Singapore (+65)</option>
                            <option value="+61">Australia (+61)</option>
                            <option value="+49">Germany (+49)</option>
                            <option value="+33">France (+33)</option>
                            <option value="+81">Japan (+81)</option>
                            <option value="+86">China (+86)</option>
                            <option value="+60">Malaysia (+60)</option>
                        </select>
                        <small class="error" id="err-country"></small>
                    </div>

                    <div class="form-group phone-input">
                        <label for="phoneNumber">Phone Number *</label>
                        <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="9876543210" required>
                        <small class="error" id="err-phone"></small>
                    </div>
                </div>

                <div class="form-group">
                    <label for="productInterest">Product Interest *</label>
                    <select id="productInterest" name="productInterest" required>
                        <option value="">-- Select product --</option>
                        <option value="green-leaf">Whole Leaf Green Tea</option>
                        <option value="orthodox-green">Orthodox Green Tea</option>
                        <option value="sample-pack">Sample Pack</option>
                        <option value="bulk-order">Bulk / Wholesale Order</option>
                    </select>
                    <small class="error" id="err-product"></small>
                </div>

                <div class="form-group">
                    <label for="message">Message (optional)</label>
                    <textarea id="message" name="message" rows="3" placeholder="Specify quantities, delivery requirements, or general notes"></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-gold">Send Enquiry</button>
                    <span id="form-success">Enquiry submitted successfully!</span>
                </div>
            </form>
        </div>
    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('enquiryForm');
    const fullName = document.getElementById('fullName');
    const email = document.getElementById('email');
    const countryCode = document.getElementById('countryCode');
    const phone = document.getElementById('phoneNumber');
    const product = document.getElementById('productInterest');

    const errName = document.getElementById('err-name');
    const errEmail = document.getElementById('err-email');
    const errCountry = document.getElementById('err-country');
    const errPhone = document.getElementById('err-phone');
    const errProduct = document.getElementById('err-product');
    const successBox = document.getElementById('form-success');

    function onlyDigits(str) {
        return str.replace(/\D/g, '');
    }

    function validateEmail(val) {
        if (!val) return true;
        const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return re.test(val);
    }

    function clearErrors() {
        errName.textContent = '';
        errEmail.textContent = '';
        errCountry.textContent = '';
        errPhone.textContent = '';
        errProduct.textContent = '';
        successBox.style.display = 'none';
    }

    form.addEventListener('submit', (e) => {
        e.preventDefault();
        clearErrors();
        let isValid = true;

        if (fullName.value.trim().length < 2) {
            errName.textContent = 'Please enter your full name.';
            isValid = false;
        }

        if (!countryCode.value) {
            errCountry.textContent = 'Please select a country code.';
            isValid = false;
        }

        const digits = onlyDigits(phone.value);
        if (!digits) {
            errPhone.textContent = 'Please enter a valid phone number.';
            isValid = false;
        } else if (countryCode.value === '+91' && digits.length !== 10) {
            errPhone.textContent = 'India (+91) numbers must be exactly 10 digits.';
            isValid = false;
        } else if (digits.length < 6 || digits.length > 15) {
            errPhone.textContent = 'Phone number must be 6 to 15 digits.';
            isValid = false;
        }

        const emailVal = email.value.trim();
        if (emailVal && !validateEmail(emailVal)) {
            errEmail.textContent = 'Please provide a valid email format (e.g. name@domain.com).';
            isValid = false;
        }

        if (!product.value) {
            errProduct.textContent = 'Please choose a product interest.';
            isValid = false;
        }

        if (!isValid) {
            const firstErr = document.querySelector('.error:not(:empty)');
            if (firstErr) {
                const input = firstErr.previousElementSibling;
                if (input && typeof input.focus === 'function') input.focus();
            }
            return;
        }

        successBox.style.display = 'inline-block';
        form.reset();
    });

    [fullName, email, phone].forEach(el => el.addEventListener('input', clearErrors));
    [countryCode, product].forEach(el => el.addEventListener('change', clearErrors));
});
</script>

</body>
</html>
